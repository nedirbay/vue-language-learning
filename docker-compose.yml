version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub
      POSTGRES_DB: devhub
    ports:
      - "5432:5432"
    volumes:
      - devhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhub -d devhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://devhub:devhub@postgres:5432/devhub?schema=public
      JWT_SECRET: dev-only-change-in-prod
      JWT_REFRESH_SECRET: dev-only-refresh-change-in-prod
      CORS_ORIGIN: http://localhost:5173
      PORT: "4000"
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  devhub_pgdata:
